        Create a new knowledge base index. Only accessible by administrators.
        Note: Vector dimension and metric are managed by the system and not configurable via API (dimension: 4096, metric: cosine).
      tags:
        - Index Management
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - region
                - cloud
              properties:
                name:
                  type: string
                  description: Index name
                  example: "my-knowledge-base"
                region:
                  type: string
                  description: AWS/GCP region for the vector database (e.g., "us-east-1", "us-west-1")
                  example: "us-east-1"
                cloud:
                  type: string
                  description: Cloud provider ("aws" or "gcp")
                  enum: [aws, gcp]
                  example: "aws"
                assignedUser:
                  type: string
                  description: User ID to assign the index to (MongoDB ObjectId)
                  example: "60a7c8f5e8b4f5001f7a8c24"
                assignedGroup:
                  type: string
                  description: Group ID to assign the index to (MongoDB ObjectId)
                  example: "60a7c8f5e8b4f5001f7a8c25"
                sharedIndexName:
                  type: string
                  description: Shared index name (optional, defaults to name)
                  example: "my-knowledge-base"
                namespace:
                  type: string
                  description: Namespace for the index (optional, auto-generated)
                  example: "user-60a7c8f5e8b4f5001f7a8c24-index-my-knowledge-base"
