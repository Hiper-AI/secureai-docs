  /images/edits:
    post:
      summary: Image-to-Image Editing
      description: |
        Edit existing images using Google Gemini 2.5 Flash Image with text instructions.
        All requests and responses are processed through SMLTP for security and compliance.
        
        This endpoint is specifically designed for **image-to-image editing** where:
        - An image file is **required** (unlike `/images/generations` where it's optional)
        - A text prompt describes how to edit or transform the image
        - The edited image is returned with the same quality and format options
        
        All prompts and responses are automatically processed through SMLTP for audit logging and compliance.
      tags:
        - Images
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - prompt
                - image
              properties:
                prompt:
                  type: string
                  description: Text instructions describing how to edit or transform the uploaded image
                  example: "Add dramatic sunset colors to the sky and enhance the overall atmosphere"
                  minLength: 1
                  maxLength: 4000
                image:
                  type: string
                  format: binary
                  description: Image file to edit (required, JPEG, PNG, WEBP, or GIF, max 10MB)
                smltp_policy:
                  type: string
                  description: SMLTP security policy to apply (e.g., 'internal', 'public', 'confidential', 'hipaa', 'gdpr')
                  default: "internal"
                  example: "internal"
                response_format:
                  type: string
                  description: The format of the response images
                  enum: [url, b64_json]
                  default: "url"
                  example: "url"
      responses:
        '200':
          description: Image edited successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  id:
                    type: string
                    description: Unique request identifier
                    example: "f55bb4aa-ad9a-4b5a-9c94-511bf6fce806"
                  object:
                    type: string
                    example: "image.edit"
                  created:
                    type: integer
                    description: Unix timestamp of when the image was edited
                    example: 1705312200
                  data:
                    type: array
                    description: Array of edited images
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                          format: uri
                          description: URL to access the edited image (when response_format is 'url')
                          example: "http://localhost:5173/uploads/secureai_image_api_edit_68c5c6d2d57c85b102eb05e2_f55bb4aa_0.png"
                        b64_json:
                          type: string
                          description: Base64-encoded image data (when response_format is 'b64_json')
                          example: "iVBORw0KGgoAAAANSUhEUgAA..."
                        revised_prompt:
                          type: string
                          description: The prompt that was actually used for editing (may differ from input)
                          example: "Add dramatic sunset colors to the sky and enhance the overall atmosphere"
                  metadata:
                    type: object
                    properties:
                      model:
                        type: string
                        example: "google/gemini-2.5-flash-image-preview"
                      provider:
                        type: string
                        example: "Google"
                      total_images:
                        type: integer
                        example: 1
                      is_image_to_image:
                        type: boolean
                        description: Always true for this endpoint
                        example: true
                      text_response:
                        type: string
                        nullable: true
                        description: Optional text response from the model
                        example: null
                      smltp_trace_id:
                        type: string
                        description: SMLTP trace ID for audit tracking
                        example: "trx-6caec994-73af-4f2c-9e13-572d53262f2a"
                      smltp_bundle_id:
                        type: string
                        description: SMLTP bundle ID for audit tracking
                        example: "jti-26464307-d455-4a3d-9ca4-8ec144cb601c"
                      smltp_policy:
                        type: string
                        description: SMLTP policy that was applied
                        example: "internal"
              example:
                success: true
                id: "f55bb4aa-ad9a-4b5a-9c94-511bf6fce806"
                object: "image.edit"
                created: 1705312200
                data:
                  - url: "http://localhost:5173/uploads/secureai_image_api_edit_68c5c6d2d57c85b102eb05e2_f55bb4aa_0.png"
                    revised_prompt: "Add dramatic sunset colors to the sky and enhance the overall atmosphere"
                metadata:
                  model: "google/gemini-2.5-flash-image-preview"
                  provider: "Google"
                  total_images: 1
                  is_image_to_image: true
                  text_response: null
                  smltp_trace_id: "trx-6caec994-73af-4f2c-9e13-572d53262f2a"
                  smltp_bundle_id: "jti-26464307-d455-4a3d-9ca4-8ec144cb601c"
                  smltp_policy: "internal"
        '400':
          description: Invalid request parameters (missing prompt, missing image, invalid image format, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "Missing image"
                message: "An image file is required for image-to-image editing"
                request_id: "f55bb4aa-ad9a-4b5a-9c94-511bf6fce806"
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied (SMLTP policy not allowed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Image file too large (maximum 10MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "File too large"
                message: "Maximum image size is 10MB"
                request_id: "f55bb4aa-ad9a-4b5a-9c94-511bf6fce806"
        '500':
          description: Internal server error or image editing failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Image generation service unavailable (Gemini service not configured)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "Service unavailable"
                message: "Image generation service is not configured"
                request_id: "f55bb4aa-ad9a-4b5a-9c94-511bf6fce806"

  /speech/s2s/webrtc:
    post:
      summary: Initiate Speech-to-Speech WebRTC Session
      description: |
        Establishes a WebRTC connection for real-time speech-to-speech conversations using OpenAI Realtime API.
        This endpoint accepts a WebRTC SDP offer and returns an SDP answer that can be used to establish
        a peer connection with OpenAI's Realtime API.
        
        **Usage Flow:**
        1. Client creates a WebRTC offer (RTCPeerConnection.createOffer)
        2. Client sends the SDP offer to this endpoint
        3. This endpoint proxies the offer to OpenAI Realtime API
        4. Client receives SDP answer and establishes WebRTC connection
        5. Client can then have real-time voice conversations with the AI
        
        **S2S Time Tracking:**
        - Each user has a monthly S2S time quota based on their license
        - Time is tracked in minutes and deducted when sessions are logged
        - Use `/speech/s2s/status` to check remaining time
        - Use `/speech/s2s/log-session` to log session duration and deduct time
        
        **SMLTP Integration:**
        - All requests are processed through SMLTP for security and compliance
        - Model validation is enforced based on the specified SMLTP policy
        - Requests are audited and logged for compliance tracking
      tags:
        - Speech
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sdp
              properties:
                sdp:
                  type: string
                  description: WebRTC SDP offer from the client's RTCPeerConnection
                  example: "v=0\r\no=- 4611731400430051336 2 IN IP4 127.0.0.1\r\ns=-\r\nt=0 0\r\n..."
                model:
                  type: string
                  description: OpenAI Realtime model to use
                  default: "gpt-4o-mini-realtime-preview"
                  enum:
                    - "gpt-4o-mini-realtime-preview"
                    - "gpt-4o-realtime-preview"
                voice:
                  type: string
                  description: Voice to use for the AI response
                  default: "alloy"
                  enum:
                    - "alloy"
                    - "echo"
                    - "fable"
                    - "onyx"
                    - "nova"
                    - "shimmer"
                    - "ash"
                    - "ballad"
                    - "coral"
                smltp_policy:
                  type: string
                  description: SMLTP policy to apply for this session
                  default: "internal"
                  enum:
                    - "public"
                    - "internal"
                    - "internal-strict"
                    - "confidential"
                    - "hipaa"
                    - "gdpr"
                    - "pci-dss"
                output_audio:
                  type: boolean
                  description: "Whether to enable audio output (default: true)"
                  default: true
                user_id:
                  type: string
                  description: Optional user ID to bill this session to (defaults to API key owner)
                  example: "60a7c8f5e8b4f5001f7a8c23"
                instructions:
                  type: string
                  description: Optional system instructions for the AI assistant
                  example: "You are a helpful customer service agent."
      responses:
        '200':
          description: SDP answer from OpenAI Realtime API
          content:
            application/sdp:
              schema:
                type: string
                description: SDP answer that can be used with RTCPeerConnection.setRemoteDescription()
              example: "v=0\r\no=- 1234567890 2 IN IP4 127.0.0.1\r\ns=-\r\nt=0 0\r\n..."
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "Invalid SDP offer"
                message: "SDP offer is required and must be a string"
                request_id: "96bba6a4-0e7a-4fd7-93a7-3b40428729fb"
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                timeLimit:
                  summary: S2S time limit reached
                  value:
                    success: false
                    error: "S2S time limit reached"
                    message: "Insufficient S2S time remaining for this user"
                    remaining_minutes: 0
                    next_renewal_date: "2024-12-01T12:55:35.721Z"
                    request_id: "96bba6a4-0e7a-4fd7-93a7-3b40428729fb"
                modelValidation:
                  summary: Model validation failed
                  value:
                    success: false
                    error: "Model validation failed"
                    message: "Model gpt-4o-mini-realtime-preview is not allowed by SMLTP policy test-policy-active"
                    request_id: "96bba6a4-0e7a-4fd7-93a7-3b40428729fb"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "S2S WebRTC failed"
                message: "An error occurred while processing your request"
                request_id: "96bba6a4-0e7a-4fd7-93a7-3b40428729fb"

  /speech/s2s/status:
    get:
      summary: Get S2S Time Status
      description: |
        Retrieve the current Speech-to-Speech (S2S) time status for the billing user, including remaining time,
        total monthly limit, used time, and renewal information.
        
        **S2S Time Quotas:**
        - Quotas are based on the user's license tier
        - Time resets monthly based on the license assignment date
        - Non-renewable trial licenses don't auto-reset
      tags:
        - Speech
      security:
        - ApiKeyAuth: []
      parameters:
        - name: user_id
          in: query
          description: Optional user ID to check status for (defaults to API key owner)
          required: false
          schema:
            type: string
            example: "60a7c8f5e8b4f5001f7a8c23"
      responses:
        '200':
          description: S2S time status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  remaining_minutes:
                    type: number
                    description: Remaining S2S time in minutes
                    example: 38.2896
                  total_minutes:
                    type: number
                    description: Total monthly S2S time limit
                    example: 45
                  used_minutes:
                    type: number
                    description: Used S2S time this month
                    example: 6.7104
                  has_time_remaining:
                    type: boolean
                    description: Whether user has any remaining S2S time
                    example: true
                  next_renewal_date:
                    type: string
                    format: date-time
                    description: When the S2S time quota will reset (null for non-renewable licenses)
                    example: "2025-12-01T12:55:35.721Z"
                  non_renewable:
                    type: boolean
                    description: Whether this is a non-renewable trial license
                    example: false
                  request_id:
                    type: string
                    description: Request ID for tracking
                    example: "a8c307b4-c0c9-4b30-98db-5aced06c1cfe"
        '400':
          description: Invalid user_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /speech/s2s/log-session:
    post:
      summary: Log S2S Session Duration
      description: |
        Log the duration of a completed Speech-to-Speech session and deduct the time from the user's
        S2S time quota. This should be called after a session ends to track usage accurately.
        
        **Usage Tracking:**
        - Duration is specified in milliseconds
        - Automatically converted to minutes and deducted from user's quota
        - Time is tracked per-user based on license tier
        - Activity logs are created for audit purposes
      tags:
        - Speech
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                durationMs:
                  type: integer
                  description: Session duration in milliseconds
                  minimum: 0
                  example: 42624
                user_id:
                  type: string
                  description: Optional user ID to bill this session to (defaults to API key owner)
                  example: "60a7c8f5e8b4f5001f7a8c23"
      responses:
        '200':
          description: Session logged successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "S2S session logged successfully"
                  request_id:
                    type: string
                    description: Request ID for tracking
                    example: "3fb8d444-2242-4764-9202-8e9e72464192"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "Invalid user_id"
                message: "The specified user_id does not exist"
                request_id: "3fb8d444-2242-4764-9202-8e9e72464192"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "Failed to log S2S session"
                message: "An error occurred while logging the session"
                request_id: "3fb8d444-2242-4764-9202-8e9e72464192"

