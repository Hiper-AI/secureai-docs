openapi: 3.0.3
info:
  title: SecureAI External API
  description: |
    SecureAI External API provides AI chat completion and image generation capabilities with knowledge base retrieval, 
    security policies, and comprehensive usage tracking. This API is designed for external developers 
    and integrations using API key authentication.
    
    ## Key Features
    - **RAG (Retrieval-Augmented Generation)**: Automatically search knowledge bases for relevant context
    - **Multi-Model Support**: OpenAI, Anthropic, Google, Meta, and other AI models
    - **Model Redundancy & Failover**: Caller-defined failover chains (primary + fallbacks) with per-attempt timeouts
    - **OpenAI-Compatible Endpoint**: Point any OpenAI SDK at `/api/external/v1` — no code changes
    - **Image Generation**: Generate and edit images using Google Gemini 2.5 Flash Image
    - **Speech-to-Speech (S2S)**: Real-time voice conversations using OpenAI Realtime API with WebRTC
    - **Security Policies**: SMLTP policy enforcement, per-call Prompt Shield, and signed compliance receipts
    - **Usage Tracking**: Comprehensive usage monitoring, self-service quota, and rate limiting
    - **Knowledge Base Integration**: Access to personal and shared knowledge bases
    - **User Management**: Complete user, group, and role management capabilities
    - **Audit Logging**: Comprehensive activity and security audit logs
    
    ## Authentication
    All endpoints (except health check) require API key authentication using Bearer token:
    ```
    Authorization: Bearer sk-your-api-key-here
    ```
    
    ## Billing and Usage
    By default, API requests are billed to the user account that owns the API key. You can specify 
    a different user to bill by including the `user_id` parameter in your request. This allows for:
    - Multi-tenant applications with per-user billing
    - Flexible completion limit management
    - Per-user "Usage by Model" settings
    
    ## Rate Limits
    - Default: 60 requests per minute, 1000 requests per hour
    - Daily limits: 100 requests (configurable)
    - Monthly limits: 10,000 requests (configurable)
    
    ## Base URL
    ```
    https://secureai.hiperai.ai/api/external
    ```
  version: 1.1.0
  contact:
    name: SecureAI Support
    email: support@secureai.hiperai.ai
  license:
    name: Proprietary
    url: https://secureai.hiperai.ai/terms

servers:
  - url: https://secureai.hiperai.ai/api/external
    description: Production server
  - url: http://localhost:3010/api/external
    description: Development server

security:
  - ApiKeyAuth: []

paths:
  /health:
    get:
      summary: Health Check
      description: Check if the API is running and healthy. No authentication required.
      tags:
        - System
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2024-01-15T10:30:00.000Z"
                  version:
                    type: string
                    example: "1.0.0"

  /licenses/availability:
    get:
      summary: Get License Availability
      description: |
        Retrieve license pool limits and current usage/remaining counts. Only accessible by administrators.
      tags:
        - User Management
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: License availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  limits:
                    type: object
                    additionalProperties:
                      type: integer
                    example:
                      Essential: 1
                      Growth: 0
                      Ultra: 2
                      Early Access: 12
                  usage:
                    type: object
                    additionalProperties:
                      type: integer
                    example:
                      Essential: 1
                      Growth: 5
                      Ultra: 1
                      Early Access: 0
                  remaining:
                    type: object
                    additionalProperties:
                      oneOf:
                        - type: integer
                        - type: number
                    example:
                      Essential: 0
                      Growth: 1.7976931348623157e+308
                      Ultra: 1
                      Early Access: 12
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied - admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /models:
    get:
      summary: Get Available Models
      description: |
        Retrieve available AI models based on your API key permissions and user license.
        Models are categorized as 'standard' or 'premium' based on your subscription tier.
      tags:
        - Discovery
      security:
        - ApiKeyAuth: []
      parameters:
        - name: provider
          in: query
          description: Filter models by provider (e.g., 'openai', 'anthropic', 'google')
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of available models
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: "openai/gpt-4.1-mini"
                        name:
                          type: string
                          example: "openai/gpt-4.1-mini"
                        provider:
                          type: string
                          example: "openai"
                  user_license:
                    type: string
                    example: "Growth"
                  restrictions:
                    type: object
                    properties:
                      allowed_models:
                        type: string
                        example: "all"
                  filters:
                    type: object
                    properties:
                      provider:
                        type: string
                        nullable: true
                        example: "openai"
              example:
                success: true
                models:
                  - id: "openai/gpt-4.1-mini"
                    name: "openai/gpt-4.1-mini"
                    provider: "openai"
                  - id: "anthropic/claude-sonnet-4"
                    name: "anthropic/claude-sonnet-4"
                    provider: "anthropic"
                user_license: "Growth"
                restrictions:
                  allowed_models: "all"
                filters:
                  provider: "openai"
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  /indexes:
    get:
      summary: Get Available Knowledge Bases
      description: |
        Retrieve available knowledge bases (indexes) that your API key can access.
        Includes personal indexes, shared indexes, and the Zero-Knowledge option.
      tags:
        - Discovery
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of available knowledge bases
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  indexes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: "my-knowledge-base"
                        name:
                          type: string
                          example: "my-knowledge-base"
                        type:
                          type: string
                          enum: [system, personal, general]
                          example: "personal"
                        namespace:
                          type: string
                          example: "user-namespace"
                        description:
                          type: string
                          example: "Direct AI responses without knowledge base retrieval"
                  restrictions:
                    type: object
                    properties:
                      allowed_indexes:
                        type: string
                        example: "all user indexes"
              example:
                success: true
                indexes:
                  - id: "Zero-Knowledge"
                    name: "Zero-Knowledge"
                    type: "system"
                    description: "Direct AI responses without knowledge base retrieval"
                  - id: "my-knowledge-base"
                    name: "my-knowledge-base"
                    type: "personal"
                    namespace: "user-namespace"
                restrictions:
                  allowed_indexes: "all user indexes"
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /smltp-policies:
    get:
      summary: Get Security Policies
      description: |
        Retrieve available SMLTP (Secure Multi-Layer Trust Protocol) security policies.
        These policies determine how your data is processed and protected.
      tags:
        - Discovery
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of available security policies
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  policies:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: "internal"
                        name:
                          type: string
                          example: "Internal"
                        description:
                          type: string
                          example: "For internal company data"
                  restrictions:
                    type: object
                    properties:
                      allowed_policies:
                        type: string
                        example: "all"
              example:
                success: true
                policies:
                  - id: "public"
                    name: "Public"
                    description: "For public, non-sensitive data"
                  - id: "internal"
                    name: "Internal"
                    description: "For internal company data"
                  - id: "confidential"
                    name: "Confidential"
                    description: "For confidential business data"
                restrictions:
                  allowed_policies: "all"
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /chat/completions:
    post:
      summary: Chat Completion
      description: |
        The main endpoint for AI chat completions with optional knowledge base retrieval (RAG).
        This endpoint supports multiple AI models, security policies, and can search your
        knowledge bases for relevant context to enhance responses.
      tags:
        - Chat
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prompt
              properties:
                model:
                  type: string
                  description: The AI model to use for completion
                  example: "openai/gpt-4.1-mini"
                index:
                  type: string
                  description: Knowledge base to search for context (use 'Zero-Knowledge' for direct AI responses)
                  example: "my-knowledge-base"
                smltp_policy:
                  type: string
                  description: Security policy to apply
                  example: "internal"
                prompt:
                  type: string
                  description: The user's message/prompt
                  example: "What is the company's policy on remote work?"
                temperature:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 2
                  default: 0.7
                  description: Controls randomness in the response (0 = deterministic, 2 = very random)
                  example: 0.7
                max_tokens:
                  type: integer
                  minimum: 1
                  maximum: 4000
                  default: 1000
                  description: Maximum number of tokens in the response
                  example: 1000
                stream:
                  type: boolean
                  default: false
                  description: Whether to stream the response
                  example: false
                conversation_id:
                  type: string
                  description: Optional conversation ID for tracking
                  example: "conv-123"
                system_message:
                  type: string
                  description: Optional custom system message
                  example: "You are a helpful assistant."
                use_rag:
                  type: boolean
                  default: true
                  description: Whether to use RAG (knowledge base retrieval)
                  example: true
                user_id:
                  type: string
                  description: MongoDB ObjectId of the user to bill for this request. If not provided, the API key owner will be billed
                  example: "60a7c8f5e8b4f5001f7a8c23"
            example:
              model: "openai/gpt-4.1-mini"
              index: "my-knowledge-base"
              smltp_policy: "internal"
              prompt: "What is the company's policy on remote work?"
              temperature: 0.7
              max_tokens: 1000
              stream: false
              conversation_id: "conv-123"
              system_message: "You are a helpful assistant."
              use_rag: true
              user_id: "60a7c8f5e8b4f5001f7a8c23"
      responses:
        '200':
          description: Successful chat completion
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  id:
                    type: string
                    example: "req-abc123"
                  object:
                    type: string
                    example: "chat.completion"
                  created:
                    type: integer
                    example: 1705312200
                  model:
                    type: string
                    example: "openai/gpt-4.1-mini"
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                          example: 0
                        message:
                          type: object
                          properties:
                            role:
                              type: string
                              example: "assistant"
                            content:
                              type: string
                              example: "Based on the company's remote work policy..."
                        finish_reason:
                          type: string
                          example: "stop"
                  usage:
                    type: object
                    properties:
                      prompt_tokens:
                        type: integer
                        example: 150
                      completion_tokens:
                        type: integer
                        example: 200
                      total_tokens:
                        type: integer
                        example: 350
                      input_tokens:
                        type: integer
                        example: 150
                      output_tokens:
                        type: integer
                        example: 200
                  metadata:
                    type: object
                    properties:
                      conversation_id:
                        type: string
                        example: "conv-123"
                      index_used:
                        type: string
                        example: "my-knowledge-base"
                      smltp_policy_used:
                        type: string
                        example: "internal"
                      rag_enabled:
                        type: boolean
                        example: true
                      documents_retrieved:
                        type: integer
                        example: 3
                      sources:
                        type: array
                        items:
                          type: object
                          properties:
                            source:
                              type: string
                              example: "remote-work-policy.pdf"
                            score:
                              type: number
                              format: float
                              example: 0.95
              example:
                success: true
                id: "req-abc123"
                object: "chat.completion"
                created: 1705312200
                model: "openai/gpt-4.1-mini"
                choices:
                  - index: 0
                    message:
                      role: "assistant"
                      content: "Based on the company's remote work policy..."
                    finish_reason: "stop"
                usage:
                  prompt_tokens: 150
                  completion_tokens: 200
                  total_tokens: 350
                  input_tokens: 150
                  output_tokens: 200
                metadata:
                  conversation_id: "conv-123"
                  index_used: "my-knowledge-base"
                  smltp_policy_used: "internal"
                  rag_enabled: true
                  documents_retrieved: 3
                  sources:
                    - source: "remote-work-policy.pdf"
                      score: 0.95
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied (model, index, or policy not allowed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit or usage limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/chat/completions:
    post:
      tags:
        - Chat
      summary: OpenAI-compatible chat completion
      description: |
        Drop-in OpenAI Chat Completions surface. Point any OpenAI SDK's `base_url`
        at `/api/external/v1` with a SecureAI API key. Strict OpenAI request/response
        shapes (`choices[]`, SSE `data:` frames, `[DONE]`, tool_calls passthrough).
        RAG is not available here (pinned to Zero-Knowledge). SecureAI extension
        fields (`smltp_policy`, `prompt_shield`, `models`/`fallback_models`,
        `redundancy`, `user_id`) are accepted as extra body fields and echoed back
        in a `secureai` response object.
      operationId: openaiCompatibleChatCompletion
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - messages
              properties:
                model:
                  type: string
                  example: openai/gpt-5-nano
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum: [system, user, assistant]
                      content:
                        type: string
                temperature:
                  type: number
                max_tokens:
                  type: integer
                stream:
                  type: boolean
                models:
                  type: array
                  items:
                    type: string
                fallback_models:
                  type: array
                  items:
                    type: string
                redundancy:
                  type: object
                  description: "{ timeout_ms, first_token_timeout_ms, on[] }"
                smltp_policy:
                  type: string
                prompt_shield:
                  type: object
                  description: "{ enabled?, policy? } per-call Prompt Shield override"
      responses:
        '200':
          description: OpenAI chat.completion object plus a `secureai` extension
        '400':
          description: Invalid request (OpenAI error envelope)
        '401':
          description: Invalid API key
        '429':
          description: Rate limited (or all models rate-limited)
        '502':
          description: All model attempts in the redundancy chain failed

  /policy-check:
    post:
      tags:
        - Chat
      summary: Dry-run the security pipeline (no model call, no billing)
      description: |
        Validate a completion payload against the full pipeline — input, model
        allowlists (whole redundancy chain), SMLTP policy resolution/authorization,
        Prompt Shield authorization and a report-only scan verdict, and a points
        quota preview. Accepts the same body as `/chat/completions`. Nothing is
        generated and nothing is billed.
      operationId: policyCheck
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Same schema as POST /chat/completions
      responses:
        '200':
          description: Per-check report with `allowed`, `checks`, and resolved `plan`
        '401':
          description: Invalid API key

  /usage:
    get:
      tags:
        - System
      summary: Self-service quota and usage snapshot
      description: |
        Returns the billed user's points bucket, the Usage-by-Model budget (when
        enabled), and the calling key's daily/monthly counters and rate limits.
      operationId: getUsage
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Points, usage_by_model, and api_key limit snapshot
        '401':
          description: Invalid API key

  /receipts/{bundleId}:
    get:
      tags:
        - Security
      summary: Fetch a signed SMLTP compliance receipt
      description: |
        Returns the signed compliance receipt for a gateway-routed completion. The
        bundle id is exposed on completion responses as `metadata.smltp.bundle_id`
        (classic) or `secureai.smltp_bundle_id` (/v1). Returns 404 on
        direct-provider deployments (no gateway to sign receipts).
      operationId: getReceipt
      security:
        - ApiKeyAuth: []
      parameters:
        - name: bundleId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: The signed receipt object
        '400':
          description: Invalid bundle id
        '404':
          description: No receipt for this bundle id (or non-gateway deployment)

  /images/generations:
    post:
      summary: Generate or Edit Images
      description: |
        Generate new images from text prompts or transform existing images using Google Gemini 2.5 Flash Image.
        All requests and responses are processed through SMLTP for security and compliance.
        
        This endpoint supports:
        - **Text-to-Image**: Generate images from text descriptions
        - **Image-to-Image**: Transform or edit existing images (upload an image file)
        
        All prompts and responses are automatically processed through SMLTP for audit logging and compliance.
      tags:
        - Images
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - prompt
              properties:
                prompt:
                  type: string
                  description: The text prompt describing the image to generate or how to transform the uploaded image
                  example: "A beautiful sunset over the ocean with mountains in the background, digital art style"
                  minLength: 1
                  maxLength: 4000
                image:
                  type: string
                  format: binary
                  description: Optional image file for image-to-image generation (JPEG, PNG, WEBP, or GIF, max 10MB)
                smltp_policy:
                  type: string
                  description: SMLTP security policy to apply (e.g., 'internal', 'public', 'confidential', 'hipaa', 'gdpr')
                  default: "internal"
                  example: "internal"
                response_format:
                  type: string
                  description: The format of the response images
                  enum: [url, b64_json]
                  default: "url"
                  example: "url"
                size:
                  type: string
                  description: The size of the generated images (for future use, currently uses default size)
                  default: "1024x1024"
                  example: "1024x1024"
                n:
                  type: integer
                  description: Number of images to generate (Gemini typically generates 1-4 images)
                  minimum: 1
                  maximum: 4
                  default: 1
                  example: 1
          application/json:
            schema:
              type: object
              required:
                - prompt
              properties:
                prompt:
                  type: string
                  description: The text prompt describing the image to generate
                  example: "A beautiful sunset over the ocean with mountains in the background, digital art style"
                  minLength: 1
                  maxLength: 4000
                smltp_policy:
                  type: string
                  description: SMLTP security policy to apply
                  default: "internal"
                  example: "internal"
                response_format:
                  type: string
                  description: The format of the response images
                  enum: [url, b64_json]
                  default: "url"
                  example: "url"
                size:
                  type: string
                  description: The size of the generated images (for future use)
                  default: "1024x1024"
                  example: "1024x1024"
                n:
                  type: integer
                  description: Number of images to generate
                  minimum: 1
                  maximum: 4
                  default: 1
                  example: 1
            example:
              prompt: "A beautiful sunset over the ocean with mountains in the background, digital art style"
              smltp_policy: "internal"
              response_format: "url"
              n: 1
      responses:
        '200':
          description: Images generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  id:
                    type: string
                    description: Unique request identifier
                    example: "90d3756f-41c3-4f86-a18d-e257bfbc33a3"
                  object:
                    type: string
                    example: "image.generation"
                  created:
                    type: integer
                    description: Unix timestamp of when the images were created
                    example: 1705312200
                  data:
                    type: array
                    description: Array of generated images
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                          format: uri
                          description: URL to access the generated image (when response_format is 'url')
                          example: "http://localhost:5173/uploads/secureai_image_api_68c5c6d2d57c85b102eb05e2_90d3756f_0.png"
                        b64_json:
                          type: string
                          description: Base64-encoded image data (when response_format is 'b64_json')
                          example: "iVBORw0KGgoAAAANSUhEUgAA..."
                        revised_prompt:
                          type: string
                          description: The prompt that was actually used for generation (may differ from input)
                          example: "A beautiful sunset over the ocean with mountains in the background, digital art style"
                  metadata:
                    type: object
                    properties:
                      model:
                        type: string
                        example: "google/gemini-2.5-flash-image-preview"
                      provider:
                        type: string
                        example: "Google"
                      total_images:
                        type: integer
                        example: 1
                      is_image_to_image:
                        type: boolean
                        description: Whether this was an image-to-image generation
                        example: false
                      text_response:
                        type: string
                        nullable: true
                        description: Optional text response from the model
                        example: null
                      smltp_trace_id:
                        type: string
                        description: SMLTP trace ID for audit tracking
                        example: "trx-220eca66-5e3a-4a72-886b-e6ba8cde18a6"
                      smltp_bundle_id:
                        type: string
                        description: SMLTP bundle ID for audit tracking
                        example: "jti-bb850e61-fbfe-412a-8b0d-d180d4a36d22"
                      smltp_policy:
                        type: string
                        description: SMLTP policy that was applied
                        example: "internal"
              example:
                success: true
                id: "90d3756f-41c3-4f86-a18d-e257bfbc33a3"
                object: "image.generation"
                created: 1705312200
                data:
                  - url: "http://localhost:5173/uploads/secureai_image_api_68c5c6d2d57c85b102eb05e2_90d3756f_0.png"
                    revised_prompt: "A beautiful sunset over the ocean with mountains in the background, digital art style"
                metadata:
                  model: "google/gemini-2.5-flash-image-preview"
                  provider: "Google"
                  total_images: 1
                  is_image_to_image: false
                  text_response: null
                  smltp_trace_id: "trx-220eca66-5e3a-4a72-886b-e6ba8cde18a6"
                  smltp_bundle_id: "jti-bb850e61-fbfe-412a-8b0d-d180d4a36d22"
                  smltp_policy: "internal"
        '400':
          description: Invalid request parameters (missing prompt, invalid image format, etc.)
          content:
            application/json:
              schema:
