          schema:
            type: string
        - name: outcome
          in: query
          description: Filter by outcome
          required: false
          schema:
            type: string
        - name: sortBy
          in: query
          description: Field to sort by
          required: false
          schema:
            type: string
            default: "timestamp"
        - name: sortOrder
          in: query
          description: Sort order
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: "desc"
      responses:
        '200':
          description: Activity logs with summary statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      logs:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: "60a7c8f5e8b4f5001f7a8c23"
                            timestamp:
                              type: string
                              format: date-time
                              example: "2024-01-15T10:30:00.000Z"
                            type:
                              type: string
                              example: "user_management"
                            severity:
                              type: string
                              example: "info"
                            description:
                              type: string
                              example: "External API: Created new user john@example.com"
                            user:
                              type: object
                              nullable: true
                              properties:
                                id:
                                  type: string
                                  example: "60a7c8f5e8b4f5001f7a8c24"
                                name:
                                  type: string
                                  example: "John Doe"
                                email:
                                  type: string
                                  example: "john@example.com"
                            metadata:
                              type: object
                              description: Additional metadata
                            complianceCategory:
                              type: string
                              example: "data_protection"
                            outcome:
                              type: string
                              example: "success"
                            resourceType:
                              type: string
                              example: "user"
                            resourceId:
                              type: string
                              example: "60a7c8f5e8b4f5001f7a8c25"
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                            example: 1
                          limit:
                            type: integer
                            example: 50
                          total:
                            type: integer
                            example: 150
                          pages:
                            type: integer
                            example: 3
                      summary:
                        type: object
                        properties:
                          dateRange:
                            type: object
                            properties:
                              startDate:
                                type: string
                                format: date-time
                                example: "2024-01-08T10:30:00.000Z"
                              endDate:
                                type: string
                                format: date-time
                                example: "2024-01-15T10:30:00.000Z"
                          totalLogs:
                            type: integer
                            example: 150
                          severityBreakdown:
                            type: object
                            additionalProperties:
                              type: integer
                            example:
                              info: 120
                              warning: 20
                              error: 8
                              critical: 2
                          typeBreakdown:
                            type: object
                            additionalProperties:
                              type: integer
                            example:
                              user_management: 45
                              api_access: 30
                              index_management: 25
                              smltp_policy_management: 20
                              group_management: 15
                              role_management: 15
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied - admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Transparency Log API Endpoints
  /transparency/status:
    get:
      tags:
        - SMLTP Security
      summary: Get transparency log status
      description: |
        Get overall transparency log status and system information.
        This endpoint provides system health, audit statistics, and chain integrity status.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Transparency status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "operational"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2024-01-15T10:30:00.000Z"
                  auditSystem:
                    type: object
                    properties:
                      totalEntries:
                        type: integer
                        example: 1250
                      merkleRoot:
                        type: string
                        example: "abc123def456..."
                      treeSize:
                        type: integer
                        example: 1250
                      lastEntry:
                        type: string
                        format: date-time
                        example: "2024-01-15T10:25:00.000Z"
                  chainIntegrity:
                    type: object
                    properties:
                      status:
                        type: string
                        example: "pending"
                      validEntries:
                        type: integer
                        example: 1250
                      invalidEntries:
                        type: integer
                        example: 0
                      verificationTime:
                        type: integer
                        example: 45
                  transparency:
                    type: object
                    properties:
                      publicVerification:
                        type: boolean
                        example: true
                      merkleProofs:
                        type: boolean
                        example: true
                      complianceExports:
                        type: boolean
                        example: true
                      apiVersion:
                        type: string
                        example: "1.0"
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied - admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SMLTP audit system not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transparency/entries:
    get:
      tags:
        - SMLTP Security
      summary: Get audit entries
      description: |
        Get paginated list of audit entries with optional filtering.
        Returns tamper-evident audit log entries with cryptographic proofs.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: page
          in: query
          description: Page number (1-based)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of entries per page (max 100)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: startDate
          in: query
          description: Filter entries from this date (ISO 8601)
          required: false
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: Filter entries until this date (ISO 8601)
          required: false
          schema:
            type: string
            format: date-time
        - name: event
          in: query
          description: Filter by event type
          required: false
          schema:
            type: string
            example: "BUNDLE_CREATED"
        - name: status
          in: query
          description: Filter by status
          required: false
          schema:
            type: string
            enum: [SUCCESS, ERROR]
      responses:
        '200':
          description: Audit entries retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 50
                  totalEntries:
                    type: integer
                    example: 1250
                  totalPages:
                    type: integer
                    example: 25
                  hasNext:
                    type: boolean
                    example: true
                  hasPrev:
                    type: boolean
                    example: false
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        entryId:
                          type: string
                          example: "entry-abc123def456"
                        timestamp:
                          type: string
                          format: date-time
                          example: "2024-01-15T10:25:00.000Z"
                        event:
                          type: string
                          example: "BUNDLE_CREATED"
                        actor:
                          type: string
                          example: "user-123"
                        status:
                          type: string
                          example: "SUCCESS"
                        details:
                          type: object
                          example: {"model": "gpt-4", "operation": "chat"}
                        signature:
                          type: string
                          example: "present"
                        publicKey:
                          type: string
                          example: "present"
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied - admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: No audit data available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transparency/chain-integrity:
    get:
      tags:
        - SMLTP Security
      summary: Get chain integrity status
      description: |
        Get current chain integrity status and verification results.
        Verifies the cryptographic integrity of the entire audit chain.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Chain integrity status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                    format: date-time
                    example: "2024-01-15T10:30:00.000Z"
                  verificationTime:
                    type: integer
                    example: 45
                  chainIntegrity:
                    type: string
                    enum: [maintained, violated]
                    example: "maintained"
                  statistics:
                    type: object
                    properties:
                      totalEntries:
                        type: integer
                        example: 1250
                      validEntries:
                        type: integer
                        example: 1250
                      invalidEntries:
                        type: integer
                        example: 0
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        entryId:
                          type: string
                          example: "entry-abc123def456"
                        signatureValid:
                          type: boolean
                          example: true
                        merkleValid:
                          type: boolean
                          example: true
                  merkleRoot:
                    type: string
                    example: "abc123def456..."
                  treeSize:
                    type: integer
                    example: 1250
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied - admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SMLTP audit system not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transparency/search:
    get:
      tags:
        - SMLTP Security
      summary: Search audit entries
      description: |
        Search audit entries by various criteria.
        Supports full-text search across event types, actors, and details.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: q
          in: query
          description: Search term
          required: true
          schema:
            type: string
            example: "BUNDLE_CREATED"
        - name: field
          in: query
          description: "Field to search in (default: all)"
          required: false
          schema:
            type: string
            enum: [all, event, actor, status, details]
            default: all
        - name: limit
          in: query
          description: Maximum number of results (max 100)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Search results retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  searchTerm:
                    type: string
                    example: "BUNDLE_CREATED"
                  field:
                    type: string
                    example: "all"
                  totalResults:
                    type: integer
                    example: 25
                  limit:
                    type: integer
                    example: 50
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        entryId:
                          type: string
                          example: "entry-abc123def456"
                        timestamp:
                          type: string
                          format: date-time
                          example: "2024-01-15T10:25:00.000Z"
                        event:
                          type: string
                          example: "BUNDLE_CREATED"
                        actor:
                          type: string
                          example: "user-123"
                        status:
                          type: string
                          example: "SUCCESS"
                        details:
                          type: object
                          example: {"model": "gpt-4", "operation": "chat"}
                  timestamp:
                    type: string
                    format: date-time
                    example: "2024-01-15T10:30:00.000Z"
        '400':
          description: Search term is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied - admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SMLTP audit system not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transparency/compliance-report:
    get:
      tags:
        - SMLTP Security
      summary: Generate compliance report
      description: |
        Generate compliance reports in JSON or CSV format.
        Provides comprehensive audit data for compliance and regulatory purposes.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: startDate
          in: query
          description: Start date for the report (ISO 8601)
          required: false
          schema:
            type: string
            format: date-time
            example: "2024-01-01T00:00:00.000Z"
        - name: endDate
          in: query
          description: End date for the report (ISO 8601)
          required: false
          schema:
            type: string
            format: date-time
            example: "2024-01-31T23:59:59.999Z"
        - name: format
          in: query
          description: Report format
          required: false
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        '200':
          description: Compliance report generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  exportInfo:
                    type: object
                    properties:
                      startDate:
                        type: string
                        format: date-time
                        example: "2024-01-01T00:00:00.000Z"
                      endDate:
                        type: string
                        format: date-time
                        example: "2024-01-31T23:59:59.999Z"
                      totalEntries:
                        type: integer
                        example: 1250
                      format:
                        type: string
                        example: "json"
                  merkleRoot:
                    type: string
                    example: "abc123def456..."
                  chainIntegrity:
                    type: string
                    example: "maintained"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2024-01-15T10:30:00.000Z"
            text/csv:
              schema:
                type: string
                description: CSV formatted compliance report
                example: "Entry ID,Timestamp,Event,Actor,Status,Details\nentry-123,2024-01-15T10:25:00.000Z,BUNDLE_CREATED,user-123,SUCCESS,\"{\"model\":\"gpt-4\"}\""
        '400':
          description: Invalid date format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied - admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SMLTP audit system not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: |
        API key authentication using Bearer token format.
        Example: `Authorization: Bearer sk-your-api-key-here`

  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Invalid API key"
        message:
          type: string
          example: "The provided API key is invalid or has been revoked"
        request_id:
          type: string
          example: "req-abc123"
          description: Request ID for tracking (if available)

    RateLimitError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Rate limit exceeded"
        message:
          type: string
          example: "Please reduce your request rate"
        reset_time:
          type: string
          format: date-time
          example: "2024-01-15T11:00:00.000Z"
          description: When the rate limit will reset

tags:
  - name: System
    description: System health and status endpoints
  - name: Discovery
    description: Endpoints to discover available models, indexes, and policies
  - name: Chat
    description: AI chat completion endpoints
  - name: User Management
    description: Endpoints for managing user accounts and roles
  - name: Index Management
    description: Endpoints for managing knowledge base indexes
  - name: Group Management
    description: Endpoints for managing user groups
  - name: SMLTP Security
    description: Endpoints for managing SMLTP security policies and audit logs
  - name: Role Management
    description: Endpoints for managing user roles
  - name: Activity Logs
    description: Endpoints for retrieving activity logs

externalDocs:
  description: SecureAI Documentation
  url: https://secureai.hiperai.ai/docs 